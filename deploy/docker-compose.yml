# Terracodex en un VPS con Docker: PostgreSQL + API + Caddy en un solo servidor.
# Solo Caddy publica puertos (80 y 443); la API y PostgreSQL quedan en la red interna.
#
#   cd /opt/terracodex
#   cp deploy/.env.ejemplo deploy/.env      # y completa los valores
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml logs -f api
#
# Guía: docs/despliegue-docker.md

name: terracodex

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-terracodex}
      POSTGRES_USER: ${POSTGRES_USER:-terracodex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en deploy/.env}
      TZ: America/Lima
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-terracodex}
      DB_USER: ${POSTGRES_USER:-terracodex}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en deploy/.env}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      ML_URL: http://ml:8000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      ML_API_KEY: ${ML_API_KEY:?Define ML_API_KEY en deploy/.env}
    deploy:
      resources:
        limits:
          memory: 1024m

  # Modelo de recomendación de cultivos (servicio-ml). Solo lo ve la API: no publica puertos.
  ml:
    build:
      context: ../servicio-ml
    restart: unless-stopped
    environment:
      ML_API_KEY: ${ML_API_KEY}
      # Nominatim (OpenStreetMap) pide identificar la aplicación
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-terracodex-servicio-ml/1.0}
    deploy:
      resources:
        limits:
          memory: 768m

  # Versión web de la app TerraCode (Flet). Perfil "web": solo arranca con --profile web, porque necesita el
  # código del frontend en deploy/web/app (lo copia deploy/web/publicar-web.sh).
  web:
    profiles: ["web"]
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Habla con la API por la red interna (sin salir a internet ni pasar por Caddy)
      TERRACODE_API_URL: http://api:8080
      # Tarjeta "Explorador" del home (vacío: no se muestra)
      TERRACODE_EXPLORADOR_URL: ${EXPLORADOR_DOMINIO:-}
      TZ: America/Lima
    deploy:
      resources:
        limits:
          memory: 512m

  # Explorador de TerraSprout (src/explorador.py: globo, mapa, datos NASA, asistente). Misma imagen que "web",
  # en la raíz de su propio subdominio (EXPLORADOR_DOMINIO) porque usa rutas absolutas (/mapa, /earth3d.html).
  explorador:
    profiles: ["web"]
    build:
      context: ./web
    restart: unless-stopped
    command: ["python", "explorador.py"]
    environment:
      FLET_WEB_APP_PATH: ""
      TZ: America/Lima
      # Opcionales del explorador: asistente con Gemini y mapa de Google (sin ellos usa OpenStreetMap)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MAP_PROVIDER: ${MAP_PROVIDER:-OpenStreetMap}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    deploy:
      resources:
        limits:
          memory: 1024m

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Vacío: sirve por HTTP en la IP (solo para probar). Con dominio: HTTPS automático (Let's Encrypt).
      DOMINIO: ${DOMINIO:-:80}
      # Subdominio del explorador (registro A a la IP del VPS). Vacío: explorador.localhost (no se publica)
      EXPLORADOR_DOMINIO: ${EXPLORADOR_DOMINIO:-explorador.localhost}
    volumes:
      # Carpeta y no el archivo suelto: así Caddy ve el Caddyfile nuevo tras un git pull o un tar
      - ./caddy:/etc/caddy:ro
      # Landing estática servida en la raíz del dominio
      - ./landing:/srv/landing:ro
      # APK de la app (deploy/apk/construir-apk.sh), servido en /descargas/
      - ./descargas:/srv/descargas:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres:
  caddy_data:
  caddy_config:
