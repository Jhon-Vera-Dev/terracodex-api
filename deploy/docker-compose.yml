# Terracodex en un VPS con Docker: PostgreSQL + API + Caddy en un solo servidor.
# Solo Caddy publica puertos (80 y 443); la API y PostgreSQL quedan en la red interna.
#
#   cd /opt/terracodex
#   cp deploy/.env.ejemplo deploy/.env      # y completa los valores
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml logs -f api
#
# Guía: docs/despliegue-docker.md

name: terracodex

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-terracodex}
      POSTGRES_USER: ${POSTGRES_USER:-terracodex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en deploy/.env}
      TZ: America/Lima
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-terracodex}
      DB_USER: ${POSTGRES_USER:-terracodex}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en deploy/.env}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      ML_URL: http://ml:8000
      ML_API_KEY: ${ML_API_KEY:?Define ML_API_KEY en deploy/.env}
    deploy:
      resources:
        limits:
          memory: 1024m

  # Modelo de recomendación de cultivos (servicio-ml). Solo lo ve la API: no publica puertos.
  ml:
    build:
      context: ../servicio-ml
    restart: unless-stopped
    environment:
      ML_API_KEY: ${ML_API_KEY}
      # Nominatim (OpenStreetMap) pide identificar la aplicación
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-terracodex-servicio-ml/1.0}
    deploy:
      resources:
        limits:
          memory: 768m

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Vacío: sirve por HTTP en la IP (solo para probar). Con dominio: HTTPS automático (Let's Encrypt).
      DOMINIO: ${DOMINIO:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # APK de la app (deploy/apk/construir-apk.sh), servido en /descargas/
      - ./descargas:/srv/descargas:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres:
  caddy_data:
  caddy_config:
